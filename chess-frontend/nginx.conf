# Preserve WebSocket upgrade headers when the request uses WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# If Nginx is behind a TLS-terminating proxy, preserve its original
# forwarded host/protocol. Otherwise, use the request received by Nginx.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ''      $http_host;
}

upstream chess_backend {
    server backend:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # OAuth success handler redirects the browser to this React route.
    # Keep it out of the backend /oauth2 proxy.
    location = /oauth2/redirect {
        try_files $uri /index.html;
    }

    # REST API
    location ^~ /api/ {
        proxy_pass http://chess_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Start Google OAuth2 login on Spring Security.
    location ^~ /oauth2/authorization/ {
        proxy_pass http://chess_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Google OAuth2 callback handled by Spring Security.
    location ^~ /login/oauth2/ {
        proxy_pass http://chess_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # SockJS transports and WebSocket upgrade for game/matchmaking.
    location ^~ /ws-chess {
        proxy_pass http://chess_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Vite-generated assets have content hashes and can be cached long-term.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Do not keep an old HTML entrypoint after a new deployment.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router history fallback for paths such as /login, /game/:id,
    # /history, /analysis/:id and /oauth2/redirect.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
